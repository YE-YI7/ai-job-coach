<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>益职网申副驾驶</title><link rel="stylesheet" href="sidepanel.css"></head>
  <body>
    <header><span class="mark">益</span><div><strong>网申副驾驶</strong><small id="pageTitle">等待读取页面</small></div></header>
    <main>
      <section class="intro"><h1>把重复填写交给我</h1><p>读取当前页后，你可以逐项确认。益职不会点击提交。</p><button id="scan" class="primary">读取当前网申</button></section>
      <div id="status" role="status"></div>
      <form id="fields"></form>
      <footer id="actions" hidden><button id="fill" class="primary" type="button">填写已确认字段</button><p>敏感字段不会自动填写，最终提交始终由你完成。</p></footer>
    </main>
    <script src="sidepanel.js"></script>
  </body>
